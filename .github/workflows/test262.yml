name: Test262
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 5a2c0b291f85cded63ef793dd46fd60a32c7c242
          path: test262-upstream
      - run: go run ./cmd/test262 -test262 test262 -json test262-report.json -junit test262-report.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: test262-report.*
