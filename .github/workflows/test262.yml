name: Test262
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - uses: actions/checkout@v4
        with:
          repository: tc39/test262
          # Keep this synchronized with test262/selection.json. Unlike the
          # previous value, this is an actual commit in tc39/test262.
          ref: b363f29d3c43c626dc852744ad64a0b48a003693
          path: test262-upstream
      - name: Verify pinned Test262 checkout
        run: test "$(git -C test262-upstream rev-parse HEAD)" = "$(jq -r .commit test262/selection.json)"
      - name: Run complete pinned Test262 suite
        run: >-
          go run ./cmd/test262 -all -test262 test262-upstream
          -baseline test262/full-baseline.json -timeout 100ms
          -json test262-report.json -junit test262-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: test262-report.*
