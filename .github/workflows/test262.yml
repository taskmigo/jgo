name: Test262
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  full-suite:
    name: Full pinned Test262 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Run complete pinned Test262 suite
        run: >-
          ./scripts/update-test262-coverage.sh
          --baseline-ref main
          -json test262-report.json -junit test262-report.xml
      - name: Verify committed coverage report and baseline
        if: always()
        run: git diff --exit-code -- COVERAGE.md test262/full-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: test262-report.*
