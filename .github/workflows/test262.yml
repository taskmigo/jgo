name: Test262
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  full-suite:
    name: Full pinned Test262 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Run complete pinned Test262 suite
        run: >-
          ./scripts/update-test262-coverage.sh
          --baseline-ref main
          -json test262-report.json -junit test262-report.xml
      - name: Verify generated coverage files are committed
        if: always()
        run: |
          if [[ ! -f test262-report.json || ! -f test262-report.xml ]]; then
            {
              echo '> [!CAUTION]'
              echo '> **Coverage generation failed before all reports were written.**'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if git diff --quiet -- COVERAGE.md test262/full-baseline.json; then
            {
              echo '> [!TIP]'
              echo '> **Generated `COVERAGE.md` and `full-baseline.json` are up-to-date with this PR.**'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '> [!CAUTION]'
              echo '> **Generated coverage files are stale. Regenerate and commit them.**'
            } >> "$GITHUB_STEP_SUMMARY"
            git diff -- COVERAGE.md test262/full-baseline.json
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262-report
          path: test262-report.*
