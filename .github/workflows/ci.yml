name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        go: ['1.25.x', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '${{ matrix.go }}'}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run '^$' -bench . ./...
